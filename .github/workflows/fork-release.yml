# Fork-only release: builds the fork's CLI archives and macOS app on GitHub-hosted runners and
# publishes them as a prerelease on this repository. Servers, `t3 update` and SSH hosts install
# from here because packages/shared/src/cliRelease.ts points at this repository. See FORK.md.
name: Fork release

on:
  push:
    tags:
      - "v*-nightly.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing fork tag to (re)build, for example v0.1.12-nightly.20261123.5151"
        required: true
        type: string

concurrency:
  group: fork-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  meta:
    name: Resolve release
    if: github.repository != 'pingdotgg/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
      ref: ${{ steps.meta.outputs.ref }}
      clerk_publishable_key: ${{ steps.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ steps.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ steps.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ steps.meta.outputs.relay_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: .env.example
      - id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # A fork build carries the exact version of the upstream nightly it is built on, so official
          # clients and upstream servers treat it as that nightly.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "::error::$TAG is not an upstream nightly tag."
            exit 1
          fi
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "base_tag=$TAG"
            echo "ref=$(git rev-parse HEAD)"
            echo "clerk_publishable_key=$(env_example CLERK_PUBLISHABLE_KEY)"
            echo "clerk_jwt_template=$(env_example CLERK_JWT_TEMPLATE)"
            echo "clerk_cli_oauth_client_id=$(env_example CLERK_CLI_OAUTH_CLIENT_ID)"
            echo "relay_url=$(env_example RELAY_URL)"
          } >> "$GITHUB_OUTPUT"

  compatibility:
    name: Fork compatibility
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 300
          sparse-checkout: fork
      - name: Official clients and upstream servers must still understand this build
        shell: bash
        env:
          BASE_TAG: ${{ needs.meta.outputs.base_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "refs/tags/$BASE_TAG"
          # Paths that define what the official mobile app, web app, relay and upstream servers
          # exchange with this build. A fork commit may touch them only with a `Fork-Compat:` trailer
          # explaining why the change stays compatible. See FORK.md.
          protected='^(packages/contracts/|apps/server/src/persistence/Migrations|apps/mobile/|infra/)'
          bad=0
          for sha in $(git rev-list FETCH_HEAD..HEAD); do
            files=$(git diff-tree --no-commit-id --name-only -r "$sha" | grep -E "$protected" || true)
            if [[ -n "$files" ]] && ! git log -1 --format=%B "$sha" | grep -q '^Fork-Compat:'; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") touches protocol paths without a Fork-Compat trailer:"
              echo "$files"
              bad=1
            fi
          done
          exit $bad

  quality:
    name: Typecheck and fork tests
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 300
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - run: vp run --filter @t3tools/desktop ensure:electron
      - name: Typecheck
        run: vp run typecheck
      - name: Run tests the fork touches
        shell: bash
        env:
          BASE_TAG: ${{ needs.meta.outputs.base_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "refs/tags/$BASE_TAG"
          mapfile -t tests < <(git diff --name-only --diff-filter=AM FETCH_HEAD HEAD -- '*.test.ts' '*.test.tsx' 2>/dev/null || true)
          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "The fork touches no test files."
            exit 0
          fi
          printf 'Running %s\n' "${tests[@]}"
          vp test run "${tests[@]}"

  bundle:
    name: Build JS bundle
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ needs.meta.outputs.clerk_publishable_key }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ needs.meta.outputs.clerk_jwt_template }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      T3CODE_RELAY_URL: ${{ needs.meta.outputs.relay_url }}
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.meta.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.meta.outputs.version }}"
      - run: vp run build:desktop:bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop:
    name: ${{ matrix.label }}
    needs: [meta, bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-26
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            launch_check: true
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            launch_check: false
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            launch_check: false
    uses: ./.github/workflows/release-desktop.yml
    with:
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: true
      launch_check: ${{ matrix.launch_check }}
      save_pnpm_store: true
      version: ${{ needs.meta.outputs.version }}
      ref: ${{ needs.meta.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ needs.meta.outputs.clerk_publishable_key }}
      clerk_jwt_template: ${{ needs.meta.outputs.clerk_jwt_template }}
      clerk_cli_oauth_client_id: ${{ needs.meta.outputs.clerk_cli_oauth_client_id }}
      relay_url: ${{ needs.meta.outputs.relay_url }}

  release:
    name: Publish prerelease
    needs: [meta, compatibility, quality, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.meta.outputs.ref }}
          fetch-depth: 300
          sparse-checkout: fork
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-mac-arm64
          path: desktop-mac
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=(t3-*.tar.gz t3-*.zip)
          [[ ${#archives[@]} -gt 0 ]] || { echo "No CLI archives were produced." >&2; exit 1; }
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
          # The macOS app is unsigned, so it ships without update feeds (*.yml): the desktop
          # cannot self-update and `fork/cli.ts install-desktop` installs it instead.
          cp ../desktop-mac/*.zip .
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          BASE_TAG: ${{ needs.meta.outputs.base_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/pingdotgg/t3code.git "refs/tags/$BASE_TAG"
          {
            echo "Upstream base: [$BASE_TAG](https://github.com/pingdotgg/t3code/releases/tag/$BASE_TAG)"
            echo
            echo "Fork commits:"
            git log --format='- %s' FETCH_HEAD..HEAD 2>/dev/null || echo "- (history unavailable)"
          } > notes.md
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "$TAG" release-assets/* --verify-tag --prerelease --latest=false \
            --title "$TAG" --notes-file notes.md
